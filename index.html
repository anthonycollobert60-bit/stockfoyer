<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockFoyer</title>
<meta name="description" content="Gérez le stock de nourriture de votre foyer, vos alertes et vos listes de courses.">
<meta name="theme-color" content="#5B8C5A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#FBF6EC;
    --cream-2:#F3E9D6;
    --ink:#3A2E22;
    --ink-soft:#6B5D4F;
    --green:#5B8C5A;
    --green-dark:#3E6B3C;
    --green-pale:#E4EFDF;
    --orange:#E8871E;
    --orange-pale:#FCEBD3;
    --brown:#A9713A;
    --brown-dark:#7A4E27;
    --red:#C4453A;
    --red-pale:#FBE7E4;
    --card:#FFFFFF;
    --border:#E7DCC8;
    --shadow: 0 2px 10px rgba(58,46,34,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);}
  .hidden{display:none !important;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:16px 18px;
    background:var(--cream);
    position:sticky;top:0;z-index:10;
    border-bottom:1px solid var(--border);
  }
  .topbar img{width:34px;height:34px;border-radius:9px;}
  .avatar-wrap{position:relative;cursor:pointer;flex-shrink:0;}
  .avatar-wrap img{width:34px;height:34px;border-radius:9px;object-fit:cover;display:block;}
  .avatar-badge{
    position:absolute;bottom:-4px;right:-4px;background:var(--green);color:#fff;
    font-size:9px;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--cream);
  }
  .topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-0.01em;flex:1;}
  .icon-btn{
    background:none;border:none;cursor:pointer;
    font-size:20px;padding:6px;border-radius:10px;color:var(--ink-soft);
  }
  .icon-btn:active{background:var(--cream-2);}

  main{flex:1;padding:14px 16px 100px;}

  /* ---------- Auth / foyer screens ---------- */
  .center-screen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:32px 24px;text-align:center;gap:18px;
  }
  .center-screen img.hero-logo{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow);}
  .center-screen h1{font-size:26px;margin:0;font-weight:900;}
  .center-screen p.sub{color:var(--ink-soft);margin:0;font-size:15px;max-width:320px;}
  .form-card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:22px;width:100%;max-width:360px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:12px;text-align:left;
  }
  label{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:2px;display:block;}
  input, select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--green);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:14px;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:15px;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-secondary{background:var(--cream-2);color:var(--ink);}
  .btn-ghost{background:none;color:var(--green-dark);text-decoration:underline;padding:8px;font-size:14px;}
  .btn-danger{background:var(--red-pale);color:var(--red);}
  .btn-block{width:100%;}
  .tab-switch{display:flex;gap:6px;background:var(--cream-2);padding:4px;border-radius:14px;width:100%;max-width:360px;}
  .tab-switch button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-family:inherit;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .tab-switch button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  .error-msg{background:var(--red-pale);color:var(--red);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;}
  .info-msg{background:var(--green-pale);color:var(--green-dark);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;}
  .divider-or{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;font-weight:700;width:100%;max-width:360px;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}
  .code-display{
    font-size:28px;font-weight:900;letter-spacing:4px;color:var(--green-dark);
    background:var(--green-pale);padding:14px;border-radius:14px;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:560px;background:#fff;border-top:1px solid var(--border);
    display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20;
  }
  .bottom-nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0;font-family:inherit;color:var(--ink-soft);cursor:pointer;font-size:11px;font-weight:700;
  }
  .bottom-nav button .ic{font-size:21px;}
  .bottom-nav button.active{color:var(--green-dark);}

  /* ---------- Section headers ---------- */
  .section-title{font-size:17px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title:first-child{margin-top:4px;}
  .pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--cream-2);color:var(--ink-soft);}

  /* ---------- Alert banner ---------- */
  .alert-banner{
    background:var(--orange-pale);border:1px solid #F0C98A;border-radius:16px;
    padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
  }
  .alert-banner .ic{font-size:22px;}
  .alert-banner .txt{flex:1;font-size:13.5px;font-weight:700;color:#8A5A15;}

  /* ---------- Product cards ---------- */
  .cat-group{margin-bottom:6px;}
  .cat-label{font-size:13px;font-weight:800;color:var(--ink-soft);margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
  .prod-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow);
  }
  .prod-card.low{border-color:#F0C98A;background:linear-gradient(0deg,#fff,var(--orange-pale));}
  .prod-info{flex:1;min-width:0;}
  .prod-name{font-weight:800;font-size:15px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prod-qty{font-size:13px;color:var(--ink-soft);}
  .prod-qty b{color:var(--ink);}
  .low .prod-qty b{color:#8A5A15;}
  .qty-controls{display:flex;align-items:center;gap:8px;}
  .qty-btn{
    width:32px;height:32px;border-radius:10px;border:none;background:var(--cream-2);
    font-size:18px;font-weight:800;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;
  }
  .qty-btn.plus{background:var(--green-pale);color:var(--green-dark);}
  .qty-btn.minus{background:var(--red-pale);color:var(--red);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .ic{font-size:38px;display:block;margin-bottom:10px;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;bottom:78px;right:calc(50% - 280px + 18px);
    width:56px;height:56px;border-radius:18px;background:var(--green);color:#fff;
    border:none;font-size:26px;box-shadow:0 6px 16px rgba(91,140,90,0.4);cursor:pointer;z-index:15;
  }
  @media (max-width:600px){ .fab{right:18px;} }

  /* ---------- Modal / sheet ---------- */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(58,46,34,0.35);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--cream);width:100%;max-width:560px;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:99px;margin:0 auto 14px;}
  .sheet h2{font-size:18px;margin:0 0 14px;font-weight:800;}
  .field{margin-bottom:12px;}
  .row-2{display:flex;gap:10px;}
  .row-2 .field{flex:1;}

  /* ---------- Shopping list ---------- */
  .list-item{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:11px 14px;margin-bottom:8px;
  }
  .checkbox{
    width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;
  }
  .checkbox.checked{background:var(--green);border-color:var(--green);color:#fff;}
  .list-item .txt{flex:1;font-weight:700;}
  .list-item.checked .txt{text-decoration:line-through;color:var(--ink-soft);}
  .list-item .qty-tag{font-size:12px;color:var(--ink-soft);font-weight:700;}

  /* ---------- Scanner ---------- */
  #scanner-view{width:100%;border-radius:16px;overflow:hidden;background:#000;margin-bottom:10px;}

  .loader{
    width:22px;height:22px;border:3px solid var(--cream-2);border-top-color:var(--green);
    border-radius:50%;animation:spin .7s linear infinite;margin:20px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;
    font-size:13px;font-weight:700;z-index:50;box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ AUTH SCREEN ============ -->
  <section id="screen-auth" class="center-screen hidden">
    <img class="hero-logo" src="icons/icon-192.png" alt="StockFoyer">
    <h1>StockFoyer</h1>
    <p class="sub">Le stock de nourriture de votre foyer, toujours à jour, à plusieurs.</p>

    <div class="tab-switch">
      <button id="tab-login" class="active">Connexion</button>
      <button id="tab-signup">Créer un compte</button>
    </div>

    <div class="form-card">
      <div id="auth-error" class="error-msg hidden"></div>
      <div class="field">
        <label>Email</label>
        <input id="auth-email" type="email" placeholder="vous@exemple.fr" autocomplete="email">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <div style="position:relative;">
          <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px;">
          <button type="button" id="toggle-password" class="icon-btn" style="position:absolute;right:2px;top:50%;transform:translateY(-50%);">👁️</button>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);cursor:pointer;">
        <input type="checkbox" id="auth-remember" checked style="width:18px;height:18px;">
        Rester connecté
      </label>
      <button id="auth-submit" class="btn btn-primary btn-block">Se connecter</button>
    </div>
  </section>

  <!-- ============ FOYER SETUP SCREEN ============ -->
  <section id="screen-foyer" class="center-screen hidden">
    <img class="hero-logo" src="icons/icon-192.png" alt="StockFoyer">
    <h1>Votre foyer</h1>
    <p class="sub">Créez votre foyer ou rejoignez celui de votre conjoint·e avec son code.</p>

    <div class="form-card">
      <div id="foyer-error" class="error-msg hidden"></div>
      <label>Créer un nouveau foyer</label>
      <input id="foyer-nom" type="text" placeholder="Nom du foyer (ex: Maison)">
      <button id="btn-create-foyer" class="btn btn-primary btn-block">Créer mon foyer</button>
    </div>

    <div class="divider-or">ou</div>

    <div class="form-card">
      <label>Rejoindre un foyer existant</label>
      <input id="foyer-code" type="text" placeholder="Code d'invitation" style="text-transform:uppercase;">
      <button id="btn-join-foyer" class="btn btn-secondary btn-block">Rejoindre</button>
    </div>

    <button id="btn-logout-foyer" class="btn-ghost">Se déconnecter</button>
  </section>

  <!-- ============ MAIN APP ============ -->
  <div id="screen-main" class="hidden">
    <div class="topbar">
      <div class="avatar-wrap" id="avatar-wrap" title="Changer la photo du foyer">
        <img src="icons/icon-192.png" alt="" id="foyer-avatar">
        <span class="avatar-badge">✏️</span>
      </div>
      <h1 id="foyer-title">Mon foyer</h1>
      <button class="icon-btn" id="btn-settings" title="Paramètres">⚙️</button>
    </div>
    <input type="file" id="avatar-file-input" accept="image/*" class="hidden">

    <main>
      <!-- STOCK VIEW -->
      <div id="view-stock">
        <div id="alert-banner-zone"></div>
        <div id="stock-content"></div>
      </div>

      <!-- LISTE COURSES VIEW -->
      <div id="view-liste" class="hidden">
        <div class="section-title">Liste de courses <span class="pill" id="liste-count">0</span></div>
        <div id="liste-content"></div>
      </div>

      <!-- HISTORIQUE VIEW -->
      <div id="view-historique" class="hidden">
        <div class="section-title">Historique récent</div>
        <div id="historique-content"></div>
      </div>
    </main>

    <button class="fab" id="fab-main">+</button>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="stock"><span class="ic">🥫</span>Stock</button>
      <button class="nav-btn" data-view="liste"><span class="ic">📝</span>Courses</button>
      <button class="nav-btn" data-view="historique"><span class="ic">🕒</span>Historique</button>
    </nav>
  </div>

  <div id="loading-screen" class="center-screen">
    <img class="hero-logo" src="icons/icon-192.png" alt="StockFoyer">
    <div class="loader"></div>
  </div>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="app.js?v=4"></script>
</body>
</html>
