<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F3E9D6"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C68C4F"/>
      <stop offset="1" stop-color="#A9713A"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A2C"/>
      <stop offset="1" stop-color="#71481F"/>
    </linearGradient>
    <linearGradient id="boxInside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E3A1C"/>
      <stop offset="1" stop-color="#4A2D15"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- carrot -->
  <g transform="translate(200,150) rotate(-18)">
    <path d="M0 0 C 26 4, 34 30, 20 78 C 14 98, 4 108, 0 108 C -4 108, -14 98, -20 78 C -34 30, -26 4, 0 0 Z" fill="#E8871E"/>
    <path d="M0 0 C 12 2, 16 16, 9 40 C 6 52, 2 58, 0 58 C -2 58, -6 52, -9 40 C -16 16, -12 2, 0 0 Z" fill="#F2A144" opacity="0.55"/>
    <g stroke="#4B8B4B" stroke-width="7" stroke-linecap="round">
      <path d="M-4 2 C -14 -18, -10 -34, -14 -46"/>
      <path d="M0 -2 C 0 -22, 4 -34, 2 -48"/>
      <path d="M5 2 C 15 -16, 12 -32, 18 -44"/>
    </g>
  </g>

  <!-- apple -->
  <g transform="translate(322,168)">
    <path d="M0 14 C -34 -4, -40 44, -20 66 C -8 80, 8 80, 20 66 C 40 44, 34 -4, 0 14 Z" fill="#5B8C5A"/>
    <path d="M-14 6 C -22 20, -20 42, -8 56" stroke="#7FB27C" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 14 C 2 4, 2 -6, 6 -14" stroke="#6B4423" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M6 -14 C 14 -20, 20 -18, 24 -12" stroke="#4B8B4B" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- crate -->
  <g transform="translate(96,224)">
    <polygon points="0,60 320,60 320,290 0,290" fill="url(#boxFront)"/>
    <polygon points="0,60 40,20 360,20 320,60" fill="url(#boxSide)"/>
    <polygon points="320,60 360,20 360,250 320,290" fill="#7A4E27"/>
    <polygon points="20,80 300,80 300,110 20,110" fill="url(#boxInside)"/>
    <g stroke="#7A4E27" stroke-width="10">
      <line x1="0" y1="130" x2="320" y2="130"/>
      <line x1="0" y1="200" x2="320" y2="200"/>
      <line x1="80" y1="60" x2="80" y2="290"/>
      <line x1="240" y1="60" x2="240" y2="290"/>
    </g>
    <g stroke="#5E3A1C" stroke-width="6" opacity="0.5">
      <line x1="0" y1="130" x2="320" y2="130" transform="translate(0,3)"/>
      <line x1="0" y1="200" x2="320" y2="200" transform="translate(0,3)"/>
    </g>
